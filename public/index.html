<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Household tasks</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/style.css"><script type="module" src="/boot.js"></script></head>
<body><main><header><p class="eyebrow">A shared home, a clear next step</p><h1>Household tasks</h1><label class="actor">Acting as <select id="actor"><option>Alex</option><option>Sam</option></select></label></header>
<section id="create-section" aria-labelledby="create-heading"><h2 id="create-heading">Create a task</h2><p>Choose when the task should count as complete.</p><form novalidate><label for="title">Task title</label><input id="title" type="text" maxlength="80" aria-describedby="title-error" autocomplete="off"><p id="title-error" role="alert"></p><fieldset><legend>How should completion work?</legend><label class="choice"><input type="radio" name="policy" value="direct" aria-label="Complete directly"><span><strong>Complete directly</strong><small>The task counts as complete immediately.</small></span></label><label class="choice"><input type="radio" name="policy" value="approval" aria-label="Require another person's approval"><span><strong>Require another person's approval</strong><small>Another household member must approve before it counts as complete.</small></span></label></fieldset><button type="submit" disabled>Create task</button></form></section>
<p id="notice" role="status"></p><p id="action-error" role="alert"></p><section aria-label="Your tasks" id="tasks"></section></main></body></html>
